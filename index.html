<!DOCTYPE html>
<html lang="ja">
<head>

<style>
html,body{margin:0;height:100%;background:#0b0e1c;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
html,body{height:100dvh}
#wrap{position:fixed;inset:0;overflow:hidden;touch-action:none;background:#141a3a}
#safe{position:fixed;inset:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

#rotate small{font-size:16px;color:#c9d1ff;font-weight:700}
@keyframes rot{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
</style>

<body>
<div id="wrap"><canvas id="c" tabindex="0"></canvas></div>
<div id="safe"></div>
<div id="rotate"><div class="ph"></div><div>横向きにしてね</div><small>スマホを横にすると遊べます</small></div>
<script>

addEventListener('resize', resize); addEventListener('orientationchange', resizeSoon); addEventListener('pageshow', resizeSoon);
if (window.visualViewport) visualViewport.addEventListener('resize', resize);
['fullscreenchange', 'webkitfullscreenchange'].forEach(t => document.addEventListener(t, resizeSoon));
resize();

const lerp = (a, b, t) => a + (b - a) * t;

// ===================== 入力 =====================

const GAME_CODES = new Set(['Space', 'Enter', 'Escape', 'Backspace', 'Tab', 'KeyP', 'KeyM', 'NumpadEnter']);

const keys = new Set(), pressedQ = new Set();
let framePressed = new Set();
addEventListener('keydown', e => {
  if (GAME_CODES.has(e.code) || e.code.startsWith('Arrow')) e.preventDefault();

  keys.add(e.code);

}, { passive: false });
addEventListener('keyup', e => { keys.delete(e.code); if (GAME_CODES.has(e.code)) e.preventDefault(); }, { passive: false });
addEventListener('blur', () => keys.clear());
addEventListener('mousedown', () => { cv.focus(); initAudio(); });
function readInput(pi) {
  if (game.scene === 'match' && game.ais && game.ais[pi]) return game.ais[pi].out;

  return readKeys(pi);
}
function mergeInput(a, b) {

// ===================== タッチ・クリック操作 =====================

function uiBtn(x, y, w, h, fn, direct) { uiBtns.push({ x, y, w, h, fn, direct }); }
function toLogical(e) {

function uiHit(p) {

// バーチャルパッドの配置(論理座標)
const TC = {
  stickArea: W * 0.45, R: 72, knob: 34, home: { x: 190, y: 555 },
  btns: [
    { k: 'a', label: 'A', sub: '攻撃', x: 1165, y: 600, r: 64, color: '#ff5e6c' },
    { k: 's', label: 'B', sub: '強攻撃', x: 1035, y: 655, r: 50, color: '#ffb23d' },
    { k: 'g', label: 'ガード', sub: '', x: 1048, y: 524, r: 46, color: '#4da3ff' },
    { k: 'j', label: 'ジャンプ', sub: '', x: 1182, y: 462, r: 44, color: '#3ddc97' },
    { k: 'c', label: 'つかみ', sub: '', x: 1076, y: 418, r: 36, color: '#c77dff' },   // つかみ = ガード+A を1ボタンで
    { k: 'x', label: '必殺', sub: '', x: 1190, y: 342, r: 42, color: '#ffd23d' }      // 必殺技(ゲージ満タンで光る)
  ]
};
const touch = { stick: null, btns: new Map(), pressed: new Set() };
let touchOut = { l: false, r: false, u: false, d: false, a: false, s: false, g: false, x: false, pl: false, pr: false, pu: false, pd: false, pa: false, ps: false, pg: false, px: false };
const tpState = { up: false, tilt: false, prev: {}, prevUp: false, prevJ: false };
function controlsActive() { return game.mobile && game.scene === 'match' && !game.paused && game.endTimer < 0; }
function btnsAt(p) {
  const s = new Set();
  for (const b of TC.btns) if (Math.hypot(p.x - b.x, p.y - b.y) < b.r * 1.12) s.add(b.k);
  return s;
}

function resetTouch() { touch.stick = null; touch.btns.clear(); touch.pressed.clear(); tpState.up = false; }

  st.x = p.x; st.y = p.y;

  const dx = st.x - st.bx, dy = st.y - st.by, d = Math.hypot(dx, dy), lim = TC.R * 1.25;
  if (d > lim) { st.bx += dx / d * (d - lim); st.by += dy / d * (d - lim); }
}
addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  initAudio();

  const b = uiHit(p);
  if (b) { e.preventDefault(); uiDown.set(e.pointerId, b); return; }
  if (!controlsActive()) return;
  e.preventDefault();
  try { cv.setPointerCapture && e.target === cv && cv.setPointerCapture(e.pointerId); } catch (err) {}

    const bx = clamp(p.x, TC.R + 12, TC.stickArea - TC.R), by = clamp(p.y, 130 + TC.R, H - TC.R - 8);
    touch.stick = { id: e.pointerId, bx, by, x: p.x, y: p.y };
    moveStick(touch.stick, p);
  } else if (p.x >= TC.stickArea) {
    const s = btnsAt(p); touch.btns.set(e.pointerId, s); s.forEach(k => touch.pressed.add(k));
  }
}, { passive: false });

  if (touch.stick && touch.stick.id === e.pointerId) { e.preventDefault(); moveStick(touch.stick, toLogical(e)); return; }
  if (touch.btns.has(e.pointerId)) {
    e.preventDefault();
    const old = touch.btns.get(e.pointerId), s = btnsAt(toLogical(e));
    s.forEach(k => { if (!old.has(k)) touch.pressed.add(k); });   // ボタン間スライドでも押せる
    touch.btns.set(e.pointerId, s);
  }
}, { passive: false });

    if (nb && nb.x === b.x && nb.y === b.y && nb.w === b.w && nb.h === b.h) { if (nb.direct) nb.fn(); else uiQueue.push(nb.fn); }

    o.l = dx < -0.33; o.r = dx > 0.33;

const CAN_FS = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) && !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
const UA = navigator.userAgent || '';

}
let installPrompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
addEventListener('appinstalled', () => { installPrompt = null; });
function doInstall() {
  if (!installPrompt) return;
  const p = installPrompt; installPrompt = null;
  try { p.prompt(); Promise.resolve(p.userChoice).catch(() => {}); } catch (e) {}
}
// 全画面ボタンの動作: アプリ起動中→不要 / 全画面API対応→全画面+横向き固定 / iPhone Safari など→ホーム画面追加ガイド

// ===================== メインループ(固定60fps) =====================
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(200, now - last); last = now;
  let n = 0;
  while (acc >= STEP && n < 8) { tick(); acc -= STEP; n++; }
  if (n >= 8) acc = 0;
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
cv.focus();
// テスト・デバッグ用フック
function simMatch(c0, c1, lv0, lv1, maxT) {

  let n = 0; maxT = maxT || 21600;
  while (game.scene === 'match' && n < maxT) { tickMatch(); particles.length = 0; game.banner = null; n++; }
  const fs = game.fighters;
  let winner = game.scene === 'result' ? game.winner : (fs[0].stocks !== fs[1].stocks ? (fs[0].stocks > fs[1].stocks ? 0 : 1) : (fs[0].percent <= fs[1].percent ? 0 : 1));
  return { winner, timeout: game.scene !== 'result', ticks: game.matchT, kos: game.kos.slice(), stocks: fs.map(f => f.stocks), dealt: fs.map(f => f.stats.dealt), supers: fs.map(f => f.stats.supers), superHits: fs.map(f => f.stats.superHits), superBlocked: fs.map(f => f.stats.superBlocked), superKos: game.kos.filter(k => k.bySuper).length };
}

}
