<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ニチジョウ・ファイターズ</title>
<style>
html,body{margin:0;height:100%;background:#0b0e1c;overflow:hidden;user-select:none}
canvas{display:block;margin:0 auto;outline:none}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<script>
'use strict';
// ===================== 基本設定 =====================
const W = 1280, H = 720, STEP = 1000 / 60;
const FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans CJK JP","Noto Sans JP",sans-serif';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let baseTf = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
  cv.style.marginTop = Math.max(0, (innerHeight - H * s) / 2) + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  baseTf = s * dpr;
}
addEventListener('resize', resize); resize();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);

// ===================== 入力 =====================
const P_KEYS = [
  { l: ['KeyA'], r: ['KeyD'], u: ['KeyW'], d: ['KeyS'], a: ['KeyF'], s: ['KeyG'], g: ['KeyH'] },
  { l: ['ArrowLeft'], r: ['ArrowRight'], u: ['ArrowUp'], d: ['ArrowDown'], a: ['Comma', 'Numpad1'], s: ['Period', 'Numpad2'], g: ['Slash', 'Numpad3'] }
];
const GAME_CODES = new Set(['Space', 'Enter', 'Escape', 'Backspace', 'Tab', 'KeyP', 'KeyM', 'NumpadEnter']);
P_KEYS.forEach(k => Object.values(k).forEach(a => a.forEach(c => GAME_CODES.add(c))));
const keys = new Set(), pressedQ = new Set();
let framePressed = new Set();
addEventListener('keydown', e => {
  if (GAME_CODES.has(e.code) || e.code.startsWith('Arrow')) e.preventDefault();
  if (!keys.has(e.code)) pressedQ.add(e.code);
  keys.add(e.code);
  initAudio();
}, { passive: false });
addEventListener('keyup', e => { keys.delete(e.code); if (GAME_CODES.has(e.code)) e.preventDefault(); }, { passive: false });
addEventListener('blur', () => keys.clear());
addEventListener('mousedown', () => { cv.focus(); initAudio(); });
function readInput(pi) {
  const k = P_KEYS[pi], o = {};
  for (const n in k) { o[n] = k[n].some(c => keys.has(c)); o['p' + n] = k[n].some(c => framePressed.has(c)); }
  return o;
}
function menuInput() {
  const a = readInput(0), b = readInput(1), fp = framePressed;
  return {
    up: a.pu || b.pu, down: a.pd || b.pd, left: a.pl || b.pl, right: a.pr || b.pr,
    ok: a.pa || b.pa || fp.has('Enter') || fp.has('Space') || fp.has('NumpadEnter'),
    back: a.pg || b.pg || fp.has('Escape') || fp.has('Backspace')
  };
}

// ===================== サウンド(シンセ) =====================
let AC = null, muted = false;
function initAudio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    else if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type, vol) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq) {
  if (!AC || muted) return;
  const t = AC.currentTime, len = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t);
}
function sfx(n, p) {
  switch (n) {
    case 'jump': tone(380, 620, 0.09, 'sine', 0.06); break;
    case 'dj': tone(500, 820, 0.09, 'sine', 0.06); break;
    case 'swing': noise(0.06, 0.05, 2500); break;
    case 'hit': noise(0.12, 0.22, 1800); tone(220, 90, 0.1, 'square', 0.06); break;
    case 'smash': noise(0.25, 0.35, 1200); tone(160, 45, 0.25, 'sawtooth', 0.1); break;
    case 'shield': tone(1200, 900, 0.07, 'triangle', 0.07); break;
    case 'break': tone(900, 120, 0.5, 'square', 0.08); noise(0.3, 0.2, 3000); break;
    case 'grab': tone(300, 260, 0.06, 'square', 0.05); break;
    case 'dodge': noise(0.08, 0.05, 5000); break;
    case 'ko': noise(0.7, 0.4, 900); tone(500, 40, 0.7, 'sawtooth', 0.1); break;
    case 'menu': tone(660, 660, 0.05, 'square', 0.04); break;
    case 'ok': tone(660, 990, 0.1, 'square', 0.05); break;
    case 'back': tone(500, 300, 0.08, 'square', 0.04); break;
    case 'count': tone(440, 440, 0.12, 'square', 0.06); break;
    case 'go': tone(880, 880, 0.3, 'square', 0.07); break;
    case 'land': noise(0.04, 0.04, 600); break;
  }
}

// ===================== キャラクター =====================
// bars: スピード, パワー, 重さ, ジャンプ, リーチ
const CHARS = [
  { id: 'neko', name: 'ネコ', type: 'バランス', desc: '動物。クセがなく扱いやすい万能タイプ', color: '#ffb15c', alt: '#b8bfcc',
    w: 46, h: 62, run: 6.4, gAcc: 1.2, air: 4.8, aAcc: 0.6, jump: 13.8, dj: 12.8, grav: 0.64, fall: 10.5, ff: 15.5,
    weight: 100, jumps: 2, power: 1.0, reach: 1.0, lag: 0, bars: [3, 3, 3, 3, 3] },
  { id: 'ninjin', name: 'ニンジン', type: 'スピード', desc: '野菜。速くて軽い。葉っぱで手数勝負', color: '#ff7a1a', alt: '#ffd23d',
    w: 40, h: 62, run: 8.2, gAcc: 1.6, air: 5.7, aAcc: 0.8, jump: 14.4, dj: 13.4, grav: 0.74, fall: 12, ff: 17.5,
    weight: 80, jumps: 2, power: 0.84, reach: 0.9, lag: -2, bars: [5, 2, 1, 4, 2] },
  { id: 'mug', name: 'マグカップ', type: 'パワー', desc: '日用品。重くて熱々コーヒーが強烈', color: '#4a90e2', alt: '#e84a5f',
    w: 56, h: 66, run: 5.1, gAcc: 0.9, air: 4.0, aAcc: 0.45, jump: 13.4, dj: 11.8, grav: 0.72, fall: 11.5, ff: 16,
    weight: 128, jumps: 2, power: 1.3, reach: 1.06, lag: 3, bars: [2, 5, 5, 2, 3] },
  { id: 'brush', name: 'ハブラシ', type: 'リーチ・空中', desc: '日用品。長いリーチとふわっと3段ジャンプ', color: '#2ec4b6', alt: '#ff7eb6',
    w: 32, h: 78, run: 5.8, gAcc: 1.05, air: 5.0, aAcc: 0.55, jump: 12.4, dj: 11.2, grav: 0.47, fall: 7.8, ff: 12,
    weight: 86, jumps: 3, power: 0.94, reach: 1.38, lag: 1, bars: [3, 3, 2, 5, 5] }
];
const P_COLORS = ['#ff4d5e', '#4da3ff'];

// ===================== 技データ =====================
// box: x=前方オフセット(中心), y=足元からの高さ(中心,負が上)
const MOVES = {
  jab:     { startup: 3,  active: 3,  rec: 7,  box: { x: 30, y: -42, w: 42, h: 24 }, dmg: 3,  base: 4.2, gr: 0.03,  ang: 30, kind: 'light' },
  utilt:   { startup: 5,  active: 4,  rec: 11, box: { x: 6,  y: -80, w: 60, h: 40 }, dmg: 6,  base: 6,   gr: 0.06,  ang: 84, rel: true, vert: true, kind: 'light' },
  nair:    { startup: 4,  active: 8,  rec: 9,  land: 6,  box: { x: 0, y: -34, w: 86, h: 64 }, dmg: 6, base: 5.2, gr: 0.06, ang: 40, rel: true, kind: 'light', air: true },
  uair:    { startup: 5,  active: 5,  rec: 9,  land: 6,  box: { x: 0, y: -86, w: 68, h: 40 }, dmg: 7, base: 6, gr: 0.075, ang: 86, rel: true, vert: true, kind: 'light', air: true },
  fsmash:  { startup: 16, active: 4,  rec: 24, box: { x: 46, y: -38, w: 64, h: 36 }, dmg: 15, base: 8.2, gr: 0.16, ang: 38, kind: 'strong', lunge: 3.5 },
  usmash:  { startup: 13, active: 5,  rec: 25, box: { x: 0,  y: -94, w: 86, h: 54 }, dmg: 14, base: 8,   gr: 0.15,  ang: 86, rel: true, vert: true, kind: 'strong' },
  fair:    { startup: 11, active: 4,  rec: 17, land: 12, box: { x: 38, y: -34, w: 60, h: 46 }, dmg: 12, base: 6.6, gr: 0.13, ang: 36, kind: 'strong', air: true },
  recover: { startup: 3,  active: 14, rec: 8,  land: 8,  box: { x: 4, y: -46, w: 58, h: 74 }, dmg: 5, base: 5.5, gr: 0.04, ang: 76, rel: true, kind: 'special', air: true },
  grab:    { startup: 6,  active: 3,  rec: 20, box: { x: 32, y: -38, w: 40, h: 34 }, grab: true, kind: 'grab' }
};
for (const k in MOVES) MOVES[k].id = k;
const THROW = { dmg: 9, base: 7.2, gr: 0.115, ang: 42 };
const BUF = 6, JUMPSQUAT = 3, SHIELD_MAX = 50, KB_DECAY = 0.42;

// ===================== ステージ =====================
const STAGE = { x1: 300, x2: 980, y: 480, bottom: 560 };
const PLATS = [
  { x1: 300, x2: 980, y: 480, soft: false },
  { x1: 385, x2: 565, y: 355, soft: true },
  { x1: 715, x2: 895, y: 355, soft: true },
  { x1: 550, x2: 730, y: 235, soft: true }
];
const BLAST = { x1: -300, x2: 1580, y1: -420, y2: 1020 };

// ===================== ゲーム状態 =====================
const game = {
  scene: 'title', t: 0, fade: 1, titleSel: 0, stocks: 3,
  sel: [{ ci: 0, ready: false }, { ci: 3, ready: false }], selTimer: -1,
  fighters: [], hitstop: 0, shake: 0, countdown: 0, goTimer: 0, endTimer: -1, winner: -1,
  paused: false, pauseSel: 0, resultSel: 0, banner: null
};
let frameCount = 0;
const particles = [];
const cam = { x: 640, y: 380, z: 1, sx: 0, sy: 0 };

function setScene(s) { game.scene = s; game.t = 0; game.fade = 1; }

function makeFighter(pi, ci, alt) {
  const c = CHARS[ci];
  return {
    pi, c, st: c, color: alt ? c.alt : c.color, x: pi === 0 ? 470 : 810, y: STAGE.y, vx: 0, vy: 0, kbx: 0, kby: 0,
    w: c.w, h: c.h, facing: pi === 0 ? 1 : -1, state: 'idle', t: 0, move: null, hitIds: new Set(),
    grounded: true, onSoft: false, jumps: c.jumps, canUpB: true, canDodge: true, ff: false, dropT: 0,
    percent: 0, stocks: game.stocks, shieldHP: SHIELD_MAX, invuln: 0, stunLen: 0, landLen: 0, rollDir: 0,
    bA: 0, bS: 0, bG: 0, bJ: 0, bD: 0, bL: 0, bR: 0, pctShake: 0, flash: 0, holdT: 0,
    stats: { dealt: 0, kos: 0, maxPct: 0 }, anim: 0
  };
}
function startMatch() {
  const s = game.sel;
  game.fighters = [makeFighter(0, s[0].ci, false), makeFighter(1, s[1].ci, s[0].ci === s[1].ci)];
  game.hitstop = 0; game.shake = 0; game.countdown = 150; game.goTimer = 0; game.endTimer = -1; game.winner = -1;
  game.paused = false; particles.length = 0;
  cam.x = 640; cam.y = 380; cam.z = 1;
  setScene('match');
}

// ===================== ファイター処理 =====================
function boxOf(f, m) {
  const b = m.box, r = f.st.reach, hs = f.h / 66;
  const w = b.w * r, h = b.h * hs * (m.vert ? r : 1);
  const cx = f.x + f.facing * b.x * r;
  const cy = f.y + b.y * hs - (m.vert ? (r - 1) * b.h * hs / 2 : 0);
  return { x: cx - w / 2, y: cy - h / 2, w, h, cx, cy };
}
function hurtOf(f) { return { x: f.x - f.w / 2, y: f.y - f.h, w: f.w, h: f.h }; }
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function startupOf(f, m) { return Math.max(2, m.startup + (m.kind === 'strong' ? f.st.lag : 0)); }
function activeHitbox(f) {
  const m = f.move;
  if (!m || f.state !== 'attack') return null;
  const su = startupOf(f, m);
  if (f.t < su || f.t >= su + m.active) return null;
  return boxOf(f, m);
}
function startMove(f, id, inp) {
  const m = MOVES[id];
  if (inp && !m.rel) { const d = (inp.r ? 1 : 0) - (inp.l ? 1 : 0); if (d && f.grounded) f.facing = d; }
  f.state = 'attack'; f.move = m; f.t = 0; f.hitIds.clear();
  if (id === 'recover') {
    f.canUpB = false; f.vy = -(f.st.jump + 2.2); f.ff = false; f.kbx *= 0.3; f.kby = 0;
    const d = inp ? (inp.r ? 1 : 0) - (inp.l ? 1 : 0) : 0; f.vx = d * 3; if (d) f.facing = d;
    sfx('dj');
  }
}
function airDrift(f, inp, mult) {
  const st = f.st, d = (inp.r ? 1 : 0) - (inp.l ? 1 : 0), max = st.air * (mult || 1);
  if (d) {
    if (d * f.vx < max) f.vx = Math.min(max, d * f.vx + st.aAcc * (mult || 1)) * d;
  } else {
    const fr = 0.22; f.vx = Math.abs(f.vx) <= fr ? 0 : f.vx - Math.sign(f.vx) * fr;
  }
}
function gravity(f, mult) {
  const st = f.st;
  f.vy += st.grav * (mult == null ? 1 : mult);
  const cap = f.ff ? st.ff : st.fall;
  if (f.ff && f.vy > 0) f.vy = st.ff;
  if (f.vy > cap) f.vy = cap;
}
function groundMove(f, inp) {
  const st = f.st, d = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
  if (d) {
    f.facing = d;
    const target = d * st.run;
    if (f.vx * d < 0) f.vx *= 0.3; // 振り向きは素早く
    f.vx += clamp(target - f.vx, -st.gAcc, st.gAcc);
    f.state = 'run';
  } else {
    const fr = 1.1; f.vx = Math.abs(f.vx) <= fr ? 0 : f.vx - Math.sign(f.vx) * fr;
    f.state = 'idle';
  }
}
function toJumpsquat(f) { f.state = 'jumpsquat'; f.t = 0; f.bJ = 0; }
function tryGroundActions(f, inp) {
  if (f.bA && inp.g) { f.bA = 0; startMove(f, 'grab', inp); sfx('swing'); return true; }
  if (f.bJ) { toJumpsquat(f); return true; }
  if (f.bS) { f.bS = 0; startMove(f, inp.u ? 'usmash' : 'fsmash', inp); return true; }
  if (f.bA) { f.bA = 0; startMove(f, inp.u ? 'utilt' : 'jab', inp); sfx('swing'); return true; }
  if (inp.g) { f.state = 'shield'; f.t = 0; f.bG = 0; f.vx *= 0.3; return true; }
  if (f.bD && f.onSoft) { f.bD = 0; f.dropT = 14; f.grounded = false; f.y += 3; f.state = 'air'; f.jumps = f.st.jumps - 1; return true; }
  return false;
}
function tryAirActions(f, inp) {
  if (f.bG && f.canDodge) {
    f.bG = 0; f.state = 'airdodge'; f.t = 0; f.canDodge = false; f.ff = false;
    const dx = (inp.r ? 1 : 0) - (inp.l ? 1 : 0), dy = (inp.d ? 1 : 0) - (inp.u ? 1 : 0);
    const n = Math.hypot(dx, dy) || 1;
    f.vx = dx / n * 7.5; f.vy = dy / n * 7.5; f.kbx *= 0.2; f.kby *= 0.2;
    sfx('dodge'); return true;
  }
  if (f.bS) { f.bS = 0; if (inp.u && f.canUpB) startMove(f, 'recover', inp); else if (!inp.u) startMove(f, 'fair', inp); else return false; return true; }
  if (f.bA) { f.bA = 0; startMove(f, inp.u ? 'uair' : 'nair', inp); sfx('swing'); return true; }
  if (f.bJ && f.jumps > 0) {
    f.bJ = 0; f.jumps--; f.vy = -f.st.dj; f.ff = false; f.kbx *= 0.4; f.kby = 0;
    const d = (inp.r ? 1 : 0) - (inp.l ? 1 : 0); if (d) { f.vx = d * f.st.air; f.facing = d; }
    sfx('dj'); puff(f.x, f.y, 6, '#ffffff'); return true;
  }
  return false;
}
function land(f) {
  f.jumps = f.st.jumps; f.canUpB = true; f.canDodge = true; f.ff = false;
  f.kby = 0; f.vy = 0; f.kbx *= 0.6;
  switch (f.state) {
    case 'attack':
      if (f.move && f.move.air) { const m = f.move; f.move = null; f.state = 'landing'; f.t = 0; f.landLen = m.land || 4; sfx('land'); }
      break;
    case 'air': f.state = 'landing'; f.t = 0; f.landLen = 2; sfx('land'); break;
    case 'helpless': f.state = 'landing'; f.t = 0; f.landLen = 10; sfx('land'); break;
    case 'airdodge': f.state = 'landing'; f.t = 0; f.landLen = 6; sfx('land'); break;
    case 'respawn': break;
  }
}
function physics(f) {
  const px = f.x, py = f.y, wasGround = f.grounded;
  f.x += f.vx + f.kbx; f.y += f.vy + f.kby;
  const km = Math.hypot(f.kbx, f.kby);
  if (km > 0) { const nm = Math.max(0, km - KB_DECAY); f.kbx *= nm / km; f.kby *= nm / km; }
  if (f.dropT > 0) f.dropT--;
  f.grounded = false; f.onSoft = false;
  const hw = f.w * 0.32;
  if (f.vy + f.kby >= 0 && f.state !== 'grabbed') {
    for (const p of PLATS) {
      if (p.soft && (f.dropT > 0)) continue;
      if (f.x + hw > p.x1 && f.x - hw < p.x2 && py <= p.y + 0.5 && f.y >= p.y) {
        f.y = p.y; f.grounded = true; f.onSoft = p.soft;
        if (!wasGround) land(f);
        f.vy = 0;
        break;
      }
    }
  }
  // メインステージの側面・底面
  const hw2 = f.w / 2;
  if (!f.grounded && f.x + hw2 > STAGE.x1 && f.x - hw2 < STAGE.x2 && f.y > STAGE.y && f.y - f.h < STAGE.bottom) {
    if (py - f.h >= STAGE.bottom - 1) { f.y = STAGE.bottom + f.h; if (f.vy < 0) f.vy = 0; if (f.kby < 0) f.kby = 0; }
    else if (f.y - STAGE.y < 30 && f.state !== 'hitstun') { f.y = STAGE.y; f.grounded = true; f.onSoft = false; if (!wasGround) land(f); f.vy = 0; } // 崖のぼり補助
    else { if (px < (STAGE.x1 + STAGE.x2) / 2) f.x = STAGE.x1 - hw2; else f.x = STAGE.x2 + hw2; f.kbx *= -0.3; }
  }
  if (wasGround && !f.grounded && f.state !== 'grabbed' && f.state !== 'respawn') {
    // 足場から歩いて落ちた
    if (f.jumps === f.st.jumps) f.jumps = f.st.jumps - 1;
    if (['idle', 'run', 'landing', 'shield', 'shieldDrop', 'shieldstun', 'roll', 'spot', 'jumpsquat', 'holding'].includes(f.state)) { f.state = 'air'; f.t = 0; }
  }
}
function registerBuffers(f, inp) {
  if (inp.pa) f.bA = BUF; if (inp.ps) f.bS = BUF; if (inp.pg) f.bG = BUF; if (inp.pu) f.bJ = BUF;
  if (inp.pd) f.bD = BUF; if (inp.pl) f.bL = BUF; if (inp.pr) f.bR = BUF;
}
function decBuffers(f) { for (const k of ['bA', 'bS', 'bG', 'bJ', 'bD', 'bL', 'bR']) if (f[k] > 0) f[k]--; }

function updateFighter(f, inp, o) {
  registerBuffers(f, inp);
  f.t++; f.anim++;
  if (f.invuln > 0) f.invuln--;
  if (f.flash > 0) f.flash--;
  if (f.pctShake > 0) f.pctShake--;
  if (f.state !== 'shield' && f.state !== 'shieldstun' && f.state !== 'stunned') f.shieldHP = Math.min(SHIELD_MAX, f.shieldHP + 0.09);
  const st = f.st;
  switch (f.state) {
    case 'dead':
      if (f.stocks > 0 && f.t > 60) {
        Object.assign(f, { x: 640, y: 150, vx: 0, vy: 0, kbx: 0, kby: 0, percent: 0, state: 'respawn', t: 0, move: null,
          jumps: st.jumps, canUpB: true, canDodge: true, ff: false, shieldHP: SHIELD_MAX, facing: f.pi === 0 ? 1 : -1 });
      }
      return;
    case 'respawn':
      f.vx = 0; f.vy = 0;
      if (f.t > 150 || (f.t > 20 && (inp.l || inp.r || inp.d || f.bJ || f.bA || f.bS || f.bG))) { f.state = 'air'; f.t = 0; f.invuln = 120; }
      decBuffers(f);

}

function drawFighter(f) {

  if (f.state === 'roll') rot = f.t / 24 * Math.PI * 2 * f.rollDir;
  if (f.state === 'spot') { sx = 0.8; }
  if (f.state === 'attack' && m && m.kind === 'strong' && f.t < su) { rot = -f.facing * 0.12; }

    ctx.fillStyle = c.color; rr(x + cw / 2 - 70, y + 230, 140, 26, 13); ctx.fill();
    text(c.type, x + cw / 2, y + 243, 15, '#1b2033', 'center', '900');
    text(c.desc, x + cw / 2, y + 276, 13, '#dfe4ff', 'center', '600');
    ['スピード', 'パワー', '重さ', 'ジャンプ', 'リーチ'].forEach((l, k) => statBar(x + 34, y + 302 + k * 16, l, c.bars[k], c.color));
  }
  // 下部パネル
  for (let i = 0; i < 2; i++) {
    const s = game.sel[i], x = i === 0 ? 80 : W - 520, y = 500;
    ctx.fillStyle = 'rgba(10,12,28,0.78)'; rr(x, y, 440, 130, 18); ctx.fill(); ctx.strokeStyle = P_COLORS[i]; ctx.lineWidth = 3; ctx.stroke();
    text(i === 0 ? 'プレイヤー1' : 'プレイヤー2', x + 20, y + 26, 20, P_COLORS[i], 'left', '900');
    text(CHARS[s.ci].name, x + 20, y + 66, 34, '#ffffff', 'left', '900');
    if (s.ready) { ctx.fillStyle = '#ffd23d'; rr(x + 240, y + 46, 180, 44, 22); ctx.fill(); text('じゅんびOK!', x + 330, y + 68, 22, '#1b2033', 'center', '900'); }
    text(i === 0 ? 'A/D:えらぶ  F:決定  H:もどる' : '←/→:えらぶ  ,:決定  /:もどる', x + 20, y + 108, 15, '#c9d1ff', 'left', '600');
  }
  text('ストック', W / 2, 530, 18, '#c9d1ff', 'center', '700');
  text('◀ ' + game.stocks + ' ▶', W / 2, 568, 38, '#ffffff', 'center', '900', 5);
  text('↑↓ / W S で変更', W / 2, 604, 13, '#c9d1ff', 'center', '600');
  if (game.selTimer > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 300, W, 120);
    text('バトル開始!', W / 2, 360, 64, '#ffd23d', 'center', '900', 10);
  }
  text('Esc でタイトルへ', W / 2, 700, 14, '#c9d1ff', 'center', '600');
}
function renderMatch() {
  drawBackground(true);
  ctx.save();
  ctx.translate(W / 2 + cam.sx, H / 2 + cam.sy); ctx.scale(cam.z, cam.z); ctx.translate(-cam.x, -cam.y);
  drawStage();
  const fs = game.fighters;
  // 攻撃中のキャラを手前に
  const order = [...fs].sort((a, b) => (a.state === 'attack') - (b.state === 'attack'));
  order.forEach(drawFighter);
  drawParticles();
  ctx.restore();
  drawOffscreen();
  drawHUD();
  if (game.countdown > 0) {
    const n = Math.ceil(game.countdown / 50), k = (game.countdown % 50) / 50;
    text(n + '', W / 2, H / 2 - 40, 120 + 40 * k, '#ffffff', 'center', '900', 12);
  } else if (game.goTimer > 0) {
    ctx.globalAlpha = Math.min(1, game.goTimer / 15);
    text('GO!', W / 2, H / 2 - 40, 140, '#ffd23d', 'center', '900', 12); ctx.globalAlpha = 1;
  }
  if (game.banner) {
    const b = game.banner; ctx.globalAlpha = Math.min(1, b.life / 15);
    text(b.text, W / 2, H / 2 - 120, b.text === 'GAME!' ? 130 : 44, b.color, 'center', '900', 10); ctx.globalAlpha = 1;
  }
  if (game.paused) {
    ctx.fillStyle = 'rgba(5,6,16,0.7)'; ctx.fillRect(0, 0, W, H);
    text('ポーズ', W / 2, 220, 60, '#ffffff', 'center', '900', 8);
    ['再開する', 'キャラ選択へ', 'タイトルへ'].forEach((s, i) => {
      const y = 320 + i * 64, on = game.pauseSel === i;
      ctx.fillStyle = on ? '#ffffff' : 'rgba(255,255,255,0.1)'; rr(W / 2 - 170, y - 25, 340, 50, 25); ctx.fill();
      text(s, W / 2, y, 24, on ? '#1b2033' : '#dfe4ff', 'center', '800');
    });
  }
}
function renderResult() {
  drawBackground(false);
  const wf = game.fighters[game.winner], lf = game.fighters[1 - game.winner];
  ctx.fillStyle = P_COLORS[game.winner] + '33'; ctx.fillRect(0, 0, W, H);
  text('WINNER', W / 2, 70, 30, '#ffd23d', 'center', '900', 6);
  text((game.winner === 0 ? 'プレイヤー1' : 'プレイヤー2') + '  ' + wf.c.name + ' の勝ち!', W / 2, 124, 52, '#ffffff', 'center', '900', 8);
  ctx.save(); ctx.translate(380, 450 + Math.sin(frameCount * 0.08) * -10); ctx.scale(2.6, 2.6); drawCharBody(wf.c, wf.color, 1, { t: frameCount }); ctx.restore();
  ctx.save(); ctx.translate(380 + 170, 450); ctx.scale(1.1, 1.1); ctx.globalAlpha = 0.55; drawCharBody(lf.c, lf.color, -1, { t: 0, hurt: true }); ctx.restore();
  ctx.fillStyle = '#b8f2e6'; ctx.fillRect(200, 452, 440, 6);
  // 成績
  ctx.fillStyle = 'rgba(10,12,28,0.78)'; rr(700, 190, 480, 230, 18); ctx.fill();
  text('せいせき', 940, 220, 22, '#ffd23d', 'center', '900');
  text('P1 ' + game.fighters[0].c.name, 920, 262, 18, P_COLORS[0], 'center', '900');
  text('P2 ' + game.fighters[1].c.name, 1090, 262, 18, P_COLORS[1], 'center', '900');
  [['撃墜数', 'kos'], ['与えたダメージ', 'dealt'], ['最大被ダメージ', 'maxPct']].forEach((r, i) => {
    const y = 306 + i * 38;
    text(r[0], 724, y, 16, '#c9d1ff', 'left', '700');
    text(game.fighters[0].stats[r[1]] + (r[1] === 'kos' ? '' : '%'), 920, y, 22, '#ffffff', 'center', '900');
    text(game.fighters[1].stats[r[1]] + (r[1] === 'kos' ? '' : '%'), 1090, y, 22, '#ffffff', 'center', '900');
  });
  ['もう一度(同じキャラで再戦)', 'キャラ選択へ', 'タイトルへ'].forEach((s, i) => {
    const y = 480 + i * 62, on = game.resultSel === i;
    ctx.fillStyle = on ? '#ffffff' : 'rgba(10,12,28,0.6)'; rr(740, y - 25, 400, 50, 25); ctx.fill();
    text((on ? '▶ ' : '') + s, 940, y, 22, on ? '#1b2033' : '#dfe4ff', 'center', '800');
  });
  if (game.t >= 40) text('W/S・↑/↓ でえらぶ　F・,・Enter で決定', 940, 680, 15, '#c9d1ff', 'center', '600');
}

// ===================== メインループ(固定60fps) =====================
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(200, now - last); last = now;
  let n = 0;
  while (acc >= STEP && n < 8) { tick(); acc -= STEP; n++; }
  if (n >= 8) acc = 0;
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
cv.focus();
// テスト・デバッグ用フック
window.__NF = { game, CHARS, MOVES, tick, keys, pressedQ, cam, drawCharBody, drawAttackFx, boxOf, ctx, startMatch };
</script>
